version: '3.8'

services:
  hr-vetting-tool:
    build: .
    container_name: hr_osint_vetting_app
    ports:
      - "8001:8000"
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports
    restart: unless-stopped
    networks:
      - hr_vetting_net

networks:
  hr_vetting_net:
    driver: bridge
